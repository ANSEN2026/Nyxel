<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7f1ea"/>
      <stop offset="0.5" stop-color="#eef6f1"/>
      <stop offset="1" stop-color="#e5efe9"/>
    </linearGradient>
    <radialGradient id="mint" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8ed3b4" stop-opacity="0.5"/>
      <stop offset="0.58" stop-color="#b9e3cf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#86c9c0" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#cfe7f2" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#4f9f7f" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#4f9f7f" stop-opacity="0.58"/>
      <stop offset="0.6" stop-color="#77bfa0" stop-opacity="0.44"/>
      <stop offset="1" stop-color="#a6d0b5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbon2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5fae92" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#73b9a1" stop-opacity="0.38"/>
      <stop offset="0.72" stop-color="#9fc9b4" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#c4ded0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f5f2" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#f2f5f2" stop-opacity="0"/>
      <stop offset="1" stop-color="#eef4ef" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="blurXL" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="58"/>
    </filter>
    <filter id="blurL" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="blurS" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="9" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.028"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#base)"/>
  <ellipse cx="180" cy="640" rx="620" ry="420" fill="url(#mint)"/>
  <ellipse cx="1320" cy="240" rx="620" ry="420" fill="url(#teal)"/>
  <ellipse cx="940" cy="160" rx="480" ry="300" fill="url(#blue)"/>
  <ellipse cx="880" cy="800" rx="520" ry="300" fill="url(#mint)" opacity="0.5"/>

  <g fill="none" stroke-linecap="round">
    <path d="M-220 680 C 100 520 330 780 640 600 C 900 450 1060 220 1370 300 C 1520 340 1660 270 1810 190"
          stroke="url(#ribbon)" stroke-width="180" opacity="0.28" filter="url(#blurXL)"/>
    <path d="M-160 740 C 150 580 360 820 680 635 C 940 485 1110 270 1420 345 C 1560 380 1690 320 1830 230"
          stroke="url(#ribbon2)" stroke-width="110" opacity="0.24" filter="url(#blurXL)"/>
    <path d="M-120 540 C 260 375 470 630 750 450 C 1010 282 1180 110 1460 175 C 1590 205 1690 150 1810 75"
          stroke="#9bd0c2" stroke-width="60" opacity="0.14" filter="url(#blurXL)"/>

    <g opacity="0.5" filter="url(#blurS)">
      <path d="M-120 700 C 200 540 430 786 710 616 C 980 453 1120 243 1420 318 C 1550 353 1680 298 1800 223" stroke="url(#ribbon)" stroke-width="1.3"/>
      <path d="M-160 728 C 170 568 410 814 690 638 C 970 460 1110 260 1410 336 C 1540 368 1670 316 1790 243" stroke="url(#ribbon)" stroke-width="0.9"/>
      <path d="M-80 672 C 240 514 460 758 740 590 C 1000 433 1150 228 1440 298 C 1570 330 1700 273 1810 200" stroke="url(#ribbon2)" stroke-width="1.1"/>
      <path d="M-180 772 C 130 614 380 854 660 678 C 940 500 1090 296 1390 372 C 1520 406 1650 348 1780 276" stroke="url(#ribbon2)" stroke-width="0.8"/>
      <path d="M120 818 C 360 718 560 848 820 718 C 1050 603 1180 480 1420 498" stroke="#5fae92" stroke-width="0.8" opacity="0.52"/>
    </g>

    <g opacity="0.42" filter="url(#blurS)">
      <path d="M-80 320 C 170 220 330 320 470 250 C 610 180 700 100 880 130" stroke="url(#ribbon2)" stroke-width="0.9"/>
      <path d="M260 920 C 430 780 620 850 760 720 C 880 610 980 520 1160 540" stroke="url(#ribbon)" stroke-width="0.8" opacity="0.55"/>
    </g>

    <path d="M-40 440 C 230 330 380 500 620 360 C 830 238 950 140 1170 170 C 1340 194 1490 130 1640 40"
          stroke="#5fae92" stroke-width="74" opacity="0.08" filter="url(#blurL)"/>
    <path d="M120 940 C 350 800 590 870 760 740 C 930 610 1060 520 1270 580 C 1400 615 1510 580 1630 500"
          stroke="#8ed3b4" stroke-width="96" opacity="0.07" filter="url(#blurL)"/>
  </g>

  <rect width="1600" height="900" fill="url(#fade)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.8"/>
</svg>
